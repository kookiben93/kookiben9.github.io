<!DOCTYPE html>
<html lang="fr">
<head>
   <meta charset="UTF-8">
   <title>Nous contacter</title>
   <link rel="stylesheet" type="text/css" href="contact.css">
</head>
<body>
   <header> <!-- entête de page-->
       <div> <!--les logos de liens vers les applis-->
           <img id="logoInsta" src="Images/logoInsta.png" alt="logo instagram">
           <img src="Images/logoYt.png" alt="logo youtube">
           <img src="Images/logoTiktok.png" alt="logo tiktok">
       </div>
       <div> <!-- logo et titre-->
           <img src="Images/logoEcoJeuns.png" alt="logo Eco Jeunes">
           <h1>Envie d'agir ?</h1>
       </div>
   </header>

   <aside> <!-- redirections vers : nos actions et projet, rechercher, contactez-nous-->
       <div> <!-- actions et peojet logo + redir°-->
           <a href="actions.html">Nos actions et projets</a>
           <img src="Images/actionsEtProjetsRedir.png" alt="image représentant un projet">
       </div>
       <div> <!-- barre de recherche + logo-->
           <!-- ajout d'une barre de recherche.-->
           <img src="Images/loupeImg.png" alt="image d'une loupe">
       </div>
       <div> <!-- redirection page Contact -->
           
           <a href="agir.html">Contactez-nous</a>
       </div>
    </aside>

   <section> <!-- formulaire de contact + localisation de l'entreprise-->
       <h2>Nous contacter</h2>
       <form action="/envoieDonnees" method="post">
         <ul>
           <li>
             <label for="name">Nom&nbsp;:</label>
             <input type="text" id="name" name="userName" />
           </li>
           <li>
             <label for="mail">E-mail&nbsp;:</label>
             <input type="email" id="mail" name="userMail" />
           </li>
           <li>
             <label for="msg">Message&nbsp;:</label>
             <textarea id="msg" name="userMsg"></textarea>
           </li>
         </ul>
       </form>
   </section>
</body>
</html>
