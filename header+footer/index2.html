<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>SAE-Reccueil_Besoin</title>
    <style>
        @font-face {
            font-family: 'Racing Sans One';
            src: url(RacingSansOne-Regular.ttf);
        }
        @font-face {
            font-family: 'Carter One';
            src: url(CarterOne-Regular.ttf);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
       body {
            background-color: #e6f4e3;
            padding-top: 140px; /* Pour compenser le header fixe */
            padding-bottom: 200px; /* Pour compenser le footer fixe */
            font-family: 'Racing Sans One', Arial, sans-serif;
            min-height: 100vh;
        }
        
       header {
            background: linear-gradient(to right, #1BBEE7, #A4E163);
            font-family: 'Racing Sans One', Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 150px;
            padding: 30px 40px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .icons {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-end;
            position: absolute;
            top: 20px;
            right: 20px;
        }
        
        .logo {
            transition: transform 0.4s;
            cursor: pointer;
        }
        
        .logo:hover {
            transform: scale(1.1);
        }
        
        h1 {
            text-align: center;
            color: white;
            margin: 10px 0;
            font-size: 2em;
        }
        
        nav {
            text-align: center;
            background-color: #13a2a6;
            margin: 10px 0 0 0;
            padding: 10px;
            border-radius: 5px;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 5%;
            padding: 5px 15px;
            border-radius: 3px;
            transition: background-color 0.3s;
        }
        
        nav a:hover {
            background-color: rgba(255,255,255,0.2);
        }
        
        #coloText {
            color: #1b515b;
            font-size: 2em;
            text-align: center;
            margin: 50px 20px;
            font-weight: bold;
        }
        
         footer {
            background: #F6D82C;
            padding: 30px 50px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        }
        
        footer > div {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        footer .exter {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding-top: 160px;
                padding-bottom: 250px;
            }
            
            nav a {
                margin: 0 2%;
                font-size: 0.9em;
            }
            
            footer > div {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            
            footer {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="icons">
        <a href="accueil.html"><img class="logo" src="Images/Instagram.png" height="40" alt="logo Instagram de Eco Jeun's"></a>
        <a href="accueil.html"><img class="logo" src="Images/Youtube.png" height="40" alt="logo Youtube de Eco Jeun's"></a>
        <a href="accueil.html"><img class="logo" src="Images/telegramme.png" height="40" alt="logo telegramme de Eco Jeun's"></a>
    </div>
    <h1>Eco Jeun's</h1>
    <nav>
        <a href="#page1">1ère page</a>
        <a href="#page2">2ème page</a>
        <a href="#contact">Contactez-nous</a>
    </nav>
</header>

<main>
    <p id="coloText">Qui sommes-nous ?</p>
    <!-- Ajoutez votre contenu ici -->
</main>

<footer>
    <div>
        <a href="accueil.html"><img class="logo" src="Images/logo.png" height="150" alt="Eco Jeun's"></a>
        <img  src="Images/Footer.png" height="150" alt="Partenariats">
        <div class="exter">
            <a href="accueil.html"><img class="logo" src="Images/Instagram.png" height="50" alt = "Eco Jeun's"></a>
            <a href="accueil.html"><img class="logo" src="Images/Youtube.png" height="50" alt = "Eco Jeun's"></a>
            <a href="accueil.html"><img class="logo" src="Images/telegramme.png" height="50" alt = "Eco Jeun's"></a>
        </div>
    </div>
</footer>
</body>
</html>
